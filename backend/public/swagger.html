<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API de Produtos — Swagger</title>
  <link rel="stylesheet" href="/swagger/swagger-ui.css">
  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    .barra {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: #1f2328;
      color: #e6e6e3;
    }

    .barra strong { font-size: 1.05rem; }
    .barra strong span { color: #4fc2b5; font-weight: 500; margin-left: 6px; }
    .barra .info { font-size: 0.88rem; color: #b8b8b2; }
    .barra code { color: #fff; background: rgba(255, 255, 255, 0.12); padding: 1px 6px; border-radius: 4px; }

    .barra a {
      color: #1f2328;
      background: #4fc2b5;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 7px 14px;
      border-radius: 8px;
    }

    .barra a:hover { filter: brightness(1.08); }

    #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 0 12px 40px; }
    .swagger-ui .info { margin: 28px 0 20px; }
    .carregando { text-align: center; color: #666; padding: 48px 16px; }
  </style>
</head>
<body>
  <header class="barra">
    <strong>API de Produtos<span>Swagger</span></strong>
    <span class="info" id="info-aluno">Preencha o campo <code>aluno</code> com o seu código em cada rota.</span>
    <a href="/">← Documentação</a>
  </header>

  <div id="swagger-ui"><p class="carregando">Carregando o Swagger...</p></div>

  <script src="/swagger/swagger-ui-bundle.js"></script>
  <script>
    // Usa o código que o aluno digitou na página de documentação (se houver).
    function lerCodigoAluno() {
      try {
        return localStorage.getItem('codigo-aluno') || '';
      } catch {
        return '';
      }
    }

    fetch('/openapi.json')
      .then((resposta) => resposta.json())
      .then((especificacao) => {
        especificacao.servers = [{ url: location.origin, description: 'Este servidor' }];

        const codigo = lerCodigoAluno();
        if (/^[a-z0-9_-]{3,30}$/.test(codigo)) {
          especificacao.components.parameters.aluno.example = codigo;
          const info = document.querySelector('#info-aluno');
          info.textContent = 'Usando o código de aluno ';
          const destaque = document.createElement('code');
          destaque.textContent = codigo;
          info.append(destaque, ' (o mesmo da documentação).');
        }

        SwaggerUIBundle({
          spec: especificacao,
          dom_id: '#swagger-ui',
          deepLinking: true,
          tryItOutEnabled: true,
          displayRequestDuration: true,
          docExpansion: 'list',
          defaultModelsExpandDepth: 0,
        });
      })
      .catch(() => {
        document.querySelector('#swagger-ui').innerHTML =
          '<p class="carregando">Não foi possível carregar a especificação (/openapi.json).</p>';
      });
  </script>
</body>
</html>
